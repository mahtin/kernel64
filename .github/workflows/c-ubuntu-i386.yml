name: Kernel64 on Linux Ubuntu i386 C CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-i386:
    # Explicitly targets Intel i386 based Ubuntu runner
    runs-on: ubuntu-latest
    container:
      image: i386/ubuntu:latest		# Forces the steps to run in a 32-bit envi
    steps:
    - uses: actions/checkout@v4
    - name: Check Environment Details
      run: |
          echo "Running on operating system:"
          cat /etc/os-release
          echo "Hardware architecture:"
          uname -m			# Will output i686 instead of x86_64
          echo "System architecture:"
          uname -s
          echo "Compiler architecture:"
          cc --version
    - name: specific i386 install
      run: apt-get update && apt-get install -y build-essential
    - name: make M32=-m32
      run: make M32=-m32 test1_idle test2_kernel
    - name: test1_idle
      run: ./test1_idle
    - name: test2_kernel
      run: ./test2_kernel
