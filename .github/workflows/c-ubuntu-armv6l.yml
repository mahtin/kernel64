name: Kernel64 on Linux Ubuntu ARM 32 bit armv6l/armv7l

on:
  push:
    branches: [ "main" ]
    paths:
    - 'Makefile'
    - '*.[hc]'
    - 'k64_switch_to_stack_armv7l.S'
    - '.github/workflows/c-ubuntu-armv6l.yml'
  pull_request:
    branches: [ "main" ]
    paths:
    - 'Makefile'
    - '*.[hc]'
    - 'k64_switch_to_stack_armv7l.S'
    - '.github/workflows/c-ubuntu-armv6l.yml'

jobs:
  test-on-ubuntu-armv6l:
    runs-on: ubuntu-20.04
    name: Build on ubuntu-20.04 armv6l
    steps:
    - uses: actions/checkout@v5
    - uses: uraimo/run-on-arch-action@v3

      name: Run commands for armv6l
      with:
        arch: armv6
        distro: ubuntu20.04
        githubToken: ${{ github.token }}	# speeds up builds by storing container images in a GitHub package registry
        install: |
              apt-get update -q -y
              apt-get install -q -y build-essential
#       name: Install build-essential / Check Environment Details (Linux) / Check Environment Details (Common) / make
#       Warning: Unexpected input(s) 'name', valid inputs are ['arch', 'distro', 'githubToken', 'env', 'run', 'shell', 'dockerRunArgs', 'setup', 'install', 'base_image']
        run: |
              echo "Running on operating system:"
              cat /etc/os-release
              echo "Hardware architecture:"
              uname -m
              echo "System architecture:"
              uname -s
              echo "Compiler architecture:"
              gcc --version
              make -j4
              ./test1_idle
              ./test2_kernel
              ./test3_nothing
              ./test4_pause
              ./test5_delay 

