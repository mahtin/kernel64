name: Deploy README Site

defaults:
  run:
    shell: bash

on:
  push:
    branches: [ "main" ]
    paths:
    - 'README.md'
    - 'THEORY-OF-OPERATIONS.md'
    - 'index.js'
    - 'package.json'
    - 'wrangler.json'
    - '.github/workflows/website-deploy.yml'
  pull_request:
    branches: [ "main" ]
    paths:
    - 'README.md'
    - 'THEORY-OF-OPERATIONS.md'
    - 'index.js'
    - 'package.json'
    - 'wrangler.json'
    - '.github/workflows/website-deploy.yml'
  workflow_dispatch:

jobs:
  kernel64-wranger-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

#    - uses: actions/checkout@v5

#   - name: Setup Node.js
#     uses: actions/setup-node@v4
#     with:
#       node-version: 20
#       cache: 'npm'

#   - name: Install Wrangler
#     run: npm install -g wrangler

    - name: Install Dependencies
      run: npm install

    - name: Deploy Wrangler
      uses: cloudflare/wrangler-action@v4
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
