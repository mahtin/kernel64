name: Kernel64 on Windows Intel x86_64

on:
  push:
    branches: [ "main" ]
    paths-ignore:
    - '*.md'
    - 'k64_switch_to_stack_[aix]*.S'
    - '.github/workflows/c-macos-ubuntu-arm64-x86_64.yml'
    - '.github/workflows/c-ubuntu-i386.yml'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
    - '*.md'
    - 'k64_switch_to_stack_[aix]*.S'
    - '.github/workflows/c-macos-ubuntu-arm64-x86_64.yml'
    - '.github/workflows/c-ubuntu-i386.yml'

jobs:
  test-on-windows-x86_64:
    runs-on: windows-latest
    defaults:
      run:
        # Crucial: Forces GitHub Actions to run steps inside MSYS2 bash
        shell: msys2 {0}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
    - name: Set up MSYS2 (Windows)
      if: ${{ runner.os == 'Windows' }}
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64		# Universal C Runtime (UCRT) vs the older MINGW64
        update: true
        install: >-
          mingw-w64-ucrt-x86_64-gcc
          mingw-w64-ucrt-x86_64-gdb
          make
    - name: Check Environment Details (Windows)
      if: ${{ runner.os == 'Windows' }}
      run: |
          echo "Running on operating system:"
          cmd //c ver
          echo "Running via:"
          echo $MSYSTEM
    - name: Check Environment Details
      run: |
          echo "Hardware architecture:"
          uname -m
          echo "System architecture:"
          uname -s
          echo "Compiler architecture:"
          gcc --version
    - name: make
      run: make CC=gcc

#   - name: test1_idle.exe
#     continue-on-error: true
#     run: ./test1_idle.exe
#     timeout-minutes: 3

#   - name: test2_kernel.exe
#     continue-on-error: true
#     run: ./test2_kernel.exe
#     timeout-minutes: 3

#   - name: test3_nothing
#     continue-on-error: true
#     run: ./test3_nothing
#     timeout-minutes: 3

    - name: gdb test1_idle.exe
      continue-on-error: true
      run: |
        gdb -batch \
            -ex "run" \
            -ex "thread apply all bt" \
            ./test1_idle.exe
      timeout-minutes: 3

    - name: gdb test2_kernel.exe
      continue-on-error: true
      run: |
        gdb -batch \
            -ex "run" \
            -ex "thread apply all bt" \
            ./test2_kernel.exe
      timeout-minutes: 3

    - name: gdb test3_nothing.exe
      continue-on-error: true
      run: |
        gdb -batch \
            -ex "run" \
            -ex "thread apply all bt" \
            ./test3_nothing.exe
      timeout-minutes: 3
